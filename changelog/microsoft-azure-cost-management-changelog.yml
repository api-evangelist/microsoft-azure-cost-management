note: >-
  Cost Management has no single dated "API changelog" page. What it has instead is better in
  one way and worse in another: every api-version is a dated, immutable directory in
  Azure/azure-rest-api-specs, so the contract history is complete and machine-readable, but
  nothing states what CHANGED between two of them. The per-release SDK changelogs are the only
  first-party prose describing the deltas, so they are recorded here as the de-facto change
  record, with the api-version series as the authoritative version scheme.
