docs_note: >-
  The contract declares one securityScheme, azure_auth, with the implicit flow and the single
  delegated scope user_impersonation. That is the Azure Resource Manager boilerplate every ARM
  swagger carries; it is not how a service principal or an agent actually authenticates. Microsoft
  Entra ID also issues client-credentials tokens for the resource https://management.azure.com
  (scope https://management.azure.com/.default), which is the unattended path, and
  authorization-code tokens for delegated user access. The OpenID Provider metadata was fetched
  and saved; the implicit flow the swagger names is not the only option and should not be read as
  a constraint.
authorization_model:
  style: azure-rbac
  note: >-
    Cost Management does not authorize by OAuth scope. Once a token is accepted, what it can see
    and change is decided by Azure RBAC role assignments at the {scope} in the request path.
  roles:
  - name: Cost Management Reader
    grants: read cost data, budgets, views, alerts and exports at the assigned scope
  - name: Cost Management Contributor
    grants: read plus create, update and delete budgets, exports, views and scheduled actions
  source: https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles/management-and-governance
scope_paths:
