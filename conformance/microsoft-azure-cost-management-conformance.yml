domain_standard:
  id: focus
  name: FOCUS — FinOps Open Cost and Usage Specification
  body: FinOps Foundation
  conforms: true
  declared_in_contract: true
  evidence: openapi/_original/microsoft-azure-cost-management-openapi.json#/definitions/ExportType
  evidence_detail: >-
    The ExportType enum — the field that decides the shape of every scheduled cost export —
    carries the value `FocusCost` alongside the proprietary Usage / ActualCost / AmortizedCost
    values. Requesting FocusCost makes Exports emit the FinOps Foundation's cross-vendor
    cost-and-usage schema rather than Azure's own columns.
  why_it_matters: >-
    This is the difference between a FinOps team writing one ingestion for every cloud and
    writing a bespoke Azure connector. An organisation that already speaks FOCUS integrates
    Azure cost data with no mapping layer; one that does not needs a bilateral connector per
    provider. Cloud cost management is precisely a market where a standard exists, so the
    reward is real and the absence would have been a real gap.
  related_artifact: finops/microsoft-azure-cost-management-finops.yml
  dataset_versioning: '#/definitions/ExportDatasetConfiguration.dataVersion — selects the data
    version for the export; defaults to latest.'
