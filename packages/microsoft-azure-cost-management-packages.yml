note: >-
  Microsoft ships a first-party Cost Management management-plane client in every language
  the Azure SDK covers. Each entry below was read from that language registry's own
  metadata endpoint on 2026-09-17, so `version` and `published` are the registry's values,
  not a reading of the docs. The currency spread is the finding: the JavaScript and Python
  clients tracked the 2026 contract (July 2026), .NET is a year behind, Java has not shipped
  since December 2024, Go has not shipped since April 2023, and the Ruby gem is part of the
  retired azure-sdk-for-ruby generation and last moved in June 2020. A consumer picking Go or
  Ruby is picking a client written against an api-version several years older than the
  2026-06-01 contract in openapi/_original/.
