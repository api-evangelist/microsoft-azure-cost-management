note: >-
  Cost Management is not a conventional CRUD domain with foreign keys between its entities.
  It has two distinct halves. One half is a set of ARM proxy resources — Export, Budget, View,
  Alert, ScheduledAction, Setting, MarkupRule, CostAllocationRuleDefinition — each hung off a
  `{scope}` rather than off each other. The other half is a query surface (Query, Forecast,
  Dimensions, BenefitRecommendations, BenefitUtilizationSummaries, PriceSheet) that returns
  computed result sets with no identity and no lifecycle. The relationships below are the ones
  actually expressed in the contract, by $ref or by an id-bearing field; nothing is inferred
  from resemblance.
identity:
  style: arm-resource-id
  pattern: '{scope}/providers/Microsoft.CostManagement/{collection}/{name}'
  id_field: id
  name_field: name
  type_field: type
  concurrency_field: eTag
  note: >-
    Names are client-chosen on create (PUT), which is why creates are idempotent. Two
    name-availability probes exist — ScheduledActions_CheckNameAvailability and
    CostAllocationRules_CheckNameAvailability.
root:
  entity: Scope
  synthetic: true
  description: >-
    Not a resource in the contract, but the organising axis of the whole API. Every managed
    resource and almost every query hangs off a scope string: a subscription, resource group,
    management group, billing account, billing profile, department or enrollment account.
