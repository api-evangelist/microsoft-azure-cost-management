note: >-
  Cost Management is an Azure Resource Manager (ARM) resource provider, so its cross-cutting
  semantics are ARM's, not a bespoke set: bearer tokens from Microsoft Entra ID, a mandatory
  api-version query parameter, nextLink pagination, the ARM error envelope, and a scope path
  segment that decides whether you are asking about a subscription, a resource group, a
  management group, a billing account or a billing profile.
authentication:
  style: oauth2-bearer
  scheme: azure_auth
  provider: Microsoft Entra ID
  authorization_url: https://login.microsoftonline.com/common/oauth2/authorize
  discovery: https://login.microsoftonline.com/common/v2.0/.well-known/openid-configuration
  header: 'Authorization: Bearer <token>'
  spec_declared_flow: implicit
  note: >-
    The contract declares only the implicit flow with the single delegated scope
    user_impersonation. That is the ARM convention in the swagger, not the whole truth —
    Entra ID also issues client-credentials tokens for the resource
    https://management.azure.com/.default, which is how an unattended agent authenticates.
    Authorization is then RBAC, not scopes; see scopes/ and authentication/.
  see:
  - authentication/microsoft-azure-cost-management-authentication.yml
  - scopes/microsoft-azure-cost-management-scopes.yml
scope_model:
  style: path-segment
  parameter: '{scope}'
  x-ms-skip-url-encoding: true
  description: >-
    Most operations take a `{scope}` path segment that is itself a fully qualified ARM
    resource identifier. The same operationId therefore serves several org levels.
  accepted_values:
  - subscriptions/{subscriptionId}
  - subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}
  - providers/Microsoft.Management/managementGroups/{managementGroupId}
  - providers/Microsoft.Billing/billingAccounts/{billingAccountId}
  - providers/Microsoft.Billing/billingAccounts/{billingAccountId}/billingProfiles/{billingProfileId}
  - providers/Microsoft.Billing/billingAccounts/{billingAccountId}/departments/{departmentId}
  - providers/Microsoft.Billing/billingAccounts/{billingAccountId}/enrollmentAccounts/{enrollmentAccountId}
versioning:
  style: query-parameter
  parameter: api-version
  required: true
  current: '2026-06-01'
  note: Every operation requires api-version. A request without it is rejected 400
    InvalidApiVersionParameter before routing — which is why management.azure.com answers
    400 rather than 404 on unknown paths.
  see: lifecycle/microsoft-azure-cost-management-lifecycle.yml
pagination:
  style: continuation-link
  response_field: nextLink
  operations_declaring_pageable: 15
  extension: x-ms-pageable
  additional_params:
  - name: $skiptoken
    scope: Dimensions_List, Dimensions_ByExternalCloudProviderType
    description: Continuation token echoed from a partial previous response.
  - name: $top
    description: Limit the number of results returned.
  note: >-
    There is no page-number or cursor parameter. A client follows nextLink until it is absent.
    Query_Usage results are NOT paged this way — a query that would exceed the response cap
    must be narrowed or moved to Exports.
filtering:
  style: odata-subset
  parameters:
  - $filter
  - $orderby
  - $expand
  - $top
  - $skiptoken
  note: >-
    The contract calls these "OData filter option" by name, but supports only a small subset
    per operation — Budgets_List supports `eq` only; ScheduledActions_List supports `eq` on
    properties/viewId. Each parameter's description names exactly which properties and
    operators it accepts. Do not assume general OData.
  see: conformance/microsoft-azure-cost-management-conformance.yml
request_id_tracing:
