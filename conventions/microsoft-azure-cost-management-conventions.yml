idempotency:
  coverage: partial
  mechanism: http-put-plus-etag
  key_header: null
  scope:
  - Budgets_CreateOrUpdate
  - Exports_CreateOrUpdate
  - Views_CreateOrUpdate
  - Views_CreateOrUpdateByScope
  - ScheduledActions_CreateOrUpdate
  - ScheduledActions_CreateOrUpdateByScope
  - Settings_CreateOrUpdateByScope
  - MarkupRules_CreateOrUpdate
  - CostAllocationRules_CreateOrUpdate
  description: >-
    There is no Idempotency-Key header anywhere in the contract — the string "idempoten" does
    not appear in it. Replay protection comes from HTTP semantics instead: every resource
    create is a PUT to a client-chosen name, so re-sending it converges rather than duplicating,
    and Export, Budget, View, Alert and ScheduledAction all carry an `eTag` for optimistic
    concurrency. Only ScheduledActions_CreateOrUpdate and ScheduledActions_CreateOrUpdateByScope
    accept an `If-Match` header, and it is optional there.
  uncovered:
  - Exports_Execute
  - ScheduledActions_Run
  - ScheduledActions_RunByScope
  - GenerateCostDetailsReport_CreateOperation
  - GenerateDetailedCostReport_CreateOperation
  - GenerateBenefitUtilizationSummariesReport_GenerateByBillingAccount
  - GenerateBenefitUtilizationSummariesReport_GenerateByBillingProfile
  - GenerateBenefitUtilizationSummariesReport_GenerateByReservationId
  - GenerateBenefitUtilizationSummariesReport_GenerateByReservationOrderId
  - GenerateBenefitUtilizationSummariesReport_GenerateBySavingsPlanId
  - GenerateBenefitUtilizationSummariesReport_GenerateBySavingsPlanOrderId
  - GenerateReservationDetailsReport_ByBillingAccountId
  - GenerateReservationDetailsReport_ByBillingProfileId
  - PriceSheet_DownloadByBillingAccount
  - PriceSheet_DownloadByBillingProfile
  - PriceSheet_DownloadByInvoice
  uncovered_note: >-
    The job-triggering POSTs have no replay protection at all. Re-firing Exports_Execute or a
    report generation runs the job again and consumes QPU quota again. An agent retrying a
    timed-out POST here should poll for an existing operation rather than re-POST.
reversibility:
  grade: documented
  credit: 0.4
  summary: >-
    Every managed resource can be deleted, and every delete is reversible only by recreating
    the resource with the same PUT — there is no restore, undelete, recycle bin or retention
    window anywhere in the 2026-06-01 contract, and the docs state none. The one true reversal
    operation is the alert dismiss/reactivate pair. Nothing in this API moves money, so the
    cost of an irreversible action is lost configuration and lost export history, not spend.
  write_surfaces:
  - action: Create or replace a budget
    operation: Budgets_CreateOrUpdate
    reversal: Budgets_Delete
    reversal_kind: delete
    window: null
    window_source: null
    note: PUT replaces the resource wholesale. The previous budget definition is not retained
      and cannot be rolled back; capture the GET body before updating if you need to restore it.
  - action: Delete a budget
    operation: Budgets_Delete
    reversal: null
    reversal_kind: none
    window: null
    note: No restore operation exists. Recreate with Budgets_CreateOrUpdate from your own copy.
  - action: Create or replace a scheduled export
    operation: Exports_CreateOrUpdate
    reversal: Exports_Delete
    reversal_kind: delete
    window: null
  - action: Delete an export
    operation: Exports_Delete
    reversal: null
    reversal_kind: none
    window: null
    note: Deleting the export definition does not delete the CSV/parquet files already written
      to the destination storage account; those live under the storage account's own lifecycle.
      Run history (Exports_GetExecutionHistory) is lost with the definition.
  - action: Run an export now
    operation: Exports_Execute
    reversal: null
    reversal_kind: none
    window: null
    note: Not cancellable. The run writes files to the configured destination and consumes
      quota; there is no cancel operation in the contract.
  - action: Create or replace a view
    operation: Views_CreateOrUpdate / Views_CreateOrUpdateByScope
    reversal: Views_Delete / Views_DeleteByScope
    reversal_kind: delete
    window: null
  - action: Create or replace a scheduled action
    operation: ScheduledActions_CreateOrUpdate / ScheduledActions_CreateOrUpdateByScope
    reversal: ScheduledActions_Delete / ScheduledActions_DeleteByScope
    reversal_kind: delete
    window: null
    note: The only operations in the contract that accept If-Match, so a lost-update can be
      prevented here even though it cannot be undone.
  - action: Run a scheduled action now (sends email)
    operation: ScheduledActions_Run / ScheduledActions_RunByScope
    reversal: null
    reversal_kind: none
    window: null
    note: >-
      Irreversible and externally visible — it emails the addresses in
      NotificationProperties.to (up to 20 recipients). An agent should treat this as a send,
      not a rehearsal.
  - action: Dismiss an alert
    operation: Alerts_Dismiss
    reversal: Alerts_Dismiss
    reversal_kind: reverse
    window: null
    window_source: null
    note: >-
      The same PATCH carries a DismissAlertPayload whose AlertProperties.status is an
      AlertStatus enum (None, Active, Overridden, Resolved, Dismissed), so a dismissed alert
      can be set back to Active with a second call. No window is documented for this and none
      is asserted here.
  - action: Create or replace a cost allocation rule
    operation: CostAllocationRules_CreateOrUpdate
    reversal: CostAllocationRules_Delete
    reversal_kind: delete
    window: null
  - action: Create or replace a markup rule
    operation: MarkupRules_CreateOrUpdate
    reversal: MarkupRules_Delete
    reversal_kind: delete
    window: null
    note: Markup rules change what a partner's customers are billed. The rule can be deleted,
      but invoices already issued under it are not restated by this API.
  - action: Create or replace a setting
    operation: Settings_CreateOrUpdateByScope
    reversal: Settings_DeleteByScope
    reversal_kind: delete
    window: null
dry_run_mode:
  supported: false
  note: >-
    No preview, validate-only or what-if parameter exists on any of the 75 operations. The
    closest thing is the pair of name-availability checks
    (ScheduledActions_CheckNameAvailability, CostAllocationRules_CheckNameAvailability), which
    rehearse one precondition of a create and nothing else. The read surface (Query_Usage,
    Forecast_Usage, Dimensions_List) is POST-but-read-only and can be used to rehearse a
    question safely.
metadata:
  supported: partial
  note: Budgets, Exports, Views and Scheduled Actions carry ARM resource tags via the standard
    resource envelope; there is no free-form metadata bag on request bodies.
