long_running_operations:
  style: azure-async-operation
  extension: x-ms-long-running-operation
  operations: 15
  pattern: >-
    A 202 carries a Location header; the client polls that URL until it returns 200 with the
    result. GenerateCostDetailsReport and GenerateDetailedCostReport additionally expose
    explicit poller operations (GenerateCostDetailsReport_GetOperationResults,
    GenerateDetailedCostReportOperationResults_Get,
    GenerateDetailedCostReportOperationStatus_Get).
  response_headers:
