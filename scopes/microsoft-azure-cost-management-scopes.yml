docs_note: >-
  The scope surface of this API is one scope wide and that is not an omission in the contract —
  it is the Azure Resource Manager model. Entra ID issues a token for the RESOURCE
  https://management.azure.com; the delegated form is user_impersonation, and the application
  form is the .default scope. Neither carries per-operation permission. What an accepted token
  may actually do is decided afterwards by Azure RBAC role assignment at the {scope} in the
  request path — Cost Management Reader for reads, Cost Management Contributor for writes. An
  integrator looking for a fine-grained scope list will not find one, and should design around
  role assignment instead.
