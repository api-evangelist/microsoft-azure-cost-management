    MCAPriceSheetProperties:
      type: object
      description: The properties of the price sheet.
      properties:
        billingAccountID:
          type: string
          description: Unique identifier for the billing account.
          readOnly: true
        billingAccountName:
          type: string
          description: Name of the billing profile that is set up to receive invoices. The prices in the price sheet are associated
            with this billing profile.
          readOnly: true
        billingProfileId:
          type: string
          description: Unique identifier for the billing profile.
          readOnly: true
        billingProfileName:
          type: string
          description: Name of the billing profile that is set up to receive invoices. The prices in the price sheet are associated
            with this billing profile.
          readOnly: true
        productOrderName:
          type: string
          description: 'Name of the purchased product plan. Indicates if this pricing is standard Azure Plan pricing, Dev/Test
            pricing etc.


            Currently unavailable for Azure 3rd party and ReservedInstance meters.'
          readOnly: true
        serviceFamily:
          type: number
          format: float
          description: Type of Azure service. For example, Compute, Analytics, and Security.
          readOnly: true
        product:
          type: string
          description: Name of the product accruing the charges.
          readOnly: true
        productId:
          type: string
          description: Unique identifier for the product whose meter is consumed.
          readOnly: true
        skuId:
          type: string
          description: Unique identifier of the SKU
          readOnly: true
        unitOfMeasure:
          type: string
          description: How usage is measured for the service
          readOnly: true
        meterId:
          type: string
          description: Unique identifier of the meter
          readOnly: true
        meterName:
          type: string
          description: Name of the meter. The meter represents the deployable resource of an Azure service.
          readOnly: true
        meterType:
          type: string
          description: Name of the meter type
          readOnly: true
        meterCategory:
          type: string
          description: Name of the classification category for the meter. For example, Cloud services, Networking, etc.
          readOnly: true
        meterSubCategory:
          type: string
          description: Name of the meter subclassification category.
          readOnly: true
        meterRegion:
          type: string
          description: Name of the Azure region where the meter for the service is available.
          readOnly: true
        tierMinimumUnits:
          type: string
          description: Defines the lower bound of the tier range for which prices are defined. For example, if the range is
            0 to 100, tierMinimumUnits would be 0.
          readOnly: true
        effectiveStartDate:
          type: string
          format: date-time
          description: Effective start date of the Price Sheet billing period
          readOnly: true
        effectiveEndDate:
          type: string
          format: date-time
          description: Effective end date of the Price Sheet billing period
          readOnly: true
        unitPrice:
          type: string
          description: 'The per-unit price at the time of billing for a given product or service, inclusive of any negotiated
            discounts on top of the market price.


            For PriceType ReservedInstance, unit price reflects the total cost of the 1 or 3-year commitment including discounts.


            Note: The unit price isn''t the same as the effective price in usage details downloads when services have differential
            prices across tiers.


            If services have multi-tiered pricing, the effective price is a blended rate across the tiers and doesn''t show
            a tier-specific unit price. The blended price or effective price is the net price for the consumed quantity spanning
            across the multiple tiers (where each tier has a specific unit price).'
          readOnly: true
        basePrice:
          type: string
          description: 'The unit price at the time the customer signs on or the unit price at the time of service meter GA
            launch if it is after sign-on.


            This is applicable for Enterprise Agreement users'
          readOnly: true
        marketPrice:
          type: string
          description: 'The current list price for a given product or service. This price is without any negotiations and
            is based on your Microsoft Agreement type.


            For PriceType Consumption, market price is reflected as the pay-as-you-go price.


            For PriceType Savings Plan, market price reflects the Savings plan benefit on top of pay-as-you-go price for the
            corresponding commitment term.


            For PriceType ReservedInstance, market price reflects the total price of the 1 or 3-year commitment.'
          readOnly: true
        currency:
          type: string
          description: Currency in which all the prices are reflected.
          readOnly: true
        billingCurrency:
          type: string
          description: Currency in which charges are posted.
          readOnly: true
        term:
          type: string
          description: Term length for Azure Savings Plan or Reservation term – one year or three years (P1Y or P3Y)
          readOnly: true
        priceType:
          type: string
          description: Price type for a product. For example, an Azure resource with a pay-as-you-go rate with priceType as
            Consumption. Other price types include ReservedInstance and Savings Plan.
          readOnly: true
