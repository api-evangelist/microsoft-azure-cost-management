        required: true
    delete:
      operationId: MarkupRules_Delete
      tags:
      - MarkupRules
      description: Delete a markup rule for a billing account and billing profile.
      parameters:
      - $ref: '#/components/parameters/ApiVersionParameter'
      - name: billingAccountId
        in: path
        description: BillingAccount ID
        required: true
        schema:
          type: string
      - name: billingProfileId
        in: path
        description: BillingProfile ID
        required: true
        schema:
          type: string
      - name: ruleName
        in: path
        description: Markup rule name.
        required: true
        schema:
          type: string
          pattern: ^[a-zA-Z0-9_][a-zA-Z0-9_-]{0,63}$
      responses:
        '200':
          description: Resource deleted successfully.
        '204':
          description: Resource does not exist.
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-ms-examples:
        MarkupRulesDelete:
          $ref: ../examples/MarkupRulesDelete.json
