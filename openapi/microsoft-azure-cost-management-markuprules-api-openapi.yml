          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarkupRule'
        '201':
          description: Resource 'MarkupRule' create operation succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarkupRule'
        default:
          description: An unexpected error response.
