          description: The details of the error.
    OperationListResult:
      type: object
      description: Result of listing cost management operations. It contains a list of operations and a URL link to get the
        next set of results.
      properties:
        value:
          type: array
          description: List of cost management operations supported by the Microsoft.CostManagement resource provider.
          items:
