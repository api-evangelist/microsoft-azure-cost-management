method: searched
source: https://azure.microsoft.com/en-us/pricing/details/cost-management/
tags:
  - Pricing
  - FinOps
description: >-
  Replaces the 2026-05-04 scaffold, which invented a Free/Pro/Enterprise ladder with a 1,000
  request monthly quota. Microsoft publishes no such ladder. Cost Management has exactly one
  commercial shape: it is included in Azure at no additional cost, for any supported offer,
  paid subscription or free trial. The pricing page's own pricing table has a single Price row
  reading "Free for Azure". There is no metered API charge, no request quota priced in money,
  and no paid tier of the API. What is rationed is throughput, not spend — see
  rate-limits/microsoft-azure-cost-management-rate-limits.yml, where the constraint is a
  per-tenant Query Processing Unit budget.
plans:
  - id: microsoft-azure-cost-management-included
    name: Included with Azure
    type: free
    price: 0
    currency: USD
    billingPeriod: none
    description: >-
      Microsoft Cost Management is available at no additional cost as part of Azure. Access to
      cost analysis, budgets, alerts, exports and recommendations — and to the REST API behind
      them — requires only an Azure subscription under a supported offer, including a free trial.
    included:
      - Reporting — report on cost and usage
      - Data enrichment — categorize by resource tags
      - Budgets — create and manage cost and usage budgets
      - Alerting — create alerts on cost and usage budgets
      - Recommendations — eliminate idle cloud resources, right-size cloud resources
    limits:
      - label: Query API throughput
        type: quota
        metric: query-processing-units
        limit: 600
        timeFrame: hour
        geo: global
        note: Per tenant. Also 12 QPU per 10 seconds and 60 QPU per minute. Rationed capacity,
          not a priced quota.
      - label: Cost detail history
        type: constraint
        limit: 13
        metric: months
        note: GenerateCostDetailsReport will not return data older than 13 months.
      - label: Cost detail request window
        type: constraint
        limit: 1
        metric: months
        note: Maximum date range per report request.
    source: https://azure.microsoft.com/en-us/pricing/details/cost-management/
    evidence: >-
      Pricing table Price row reads "Free for Azure"; the product page states "Microsoft Cost
      Management is available at no additional cost as part of Azure. If you're using Azure
      through a supported offer — whether via a paid subscription or a free trial — you can
      access Cost Management features without extra charges."
notes:
  - The underlying Azure consumption the API reports on is of course charged; the management
    surface is not.
  - Historically Microsoft charged a percentage of AWS spend for the multicloud connector. No
    such charge appears on the current pricing page, so none is recorded here.
  - Enterprise negotiation applies to Azure itself, not to this API. There is no "contact us"
    tier for Cost Management.
plan_count: 1
