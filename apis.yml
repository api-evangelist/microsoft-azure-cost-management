description: Microsoft Cost Management is the Azure Resource Manager resource provider (Microsoft.CostManagement) for understanding and controlling
  cloud spend. Its REST API covers multidimensional cost and usage queries, forecasting, budgets and their alert thresholds, saved Cost Analysis
  views, scheduled actions that email those views, recurring data exports to customer-owned storage, cost allocation and partner markup rules,
  reservation and savings-plan benefit recommendations, and asynchronous cost detail and price sheet report generation. Exports can emit the FinOps
  Foundation's FOCUS schema, so Azure cost data lands in the same shape as other clouds. The service is included with Azure at no additional cost;
  what is rationed is throughput, through a per-tenant Query Processing Unit budget.
