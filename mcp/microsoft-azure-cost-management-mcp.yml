search_evidence:
- surface: Microsoft Learn MCP Server
  endpoint: https://learn.microsoft.com/api/mcp
  probe: 'POST {"jsonrpc":"2.0","id":1,"method":"tools/list"}'
  http_status: 200
  transport: streamable-http (text/event-stream)
  auth: none
  result: >-
    Real, anonymous and live. It returns documentation tools — microsoft_docs_search,
    microsoft_code_sample_search, microsoft_docs_fetch — with full inputSchema. It can find the
    Cost Management documentation; it cannot call a single Cost Management operation. It is a
    docs retrieval server, not an API server, so it is not recorded as this provider's MCP
    server.
- surface: Azure MCP Server (@azure/mcp)
  package: https://www.npmjs.com/package/@azure/mcp
  version: 3.0.0-beta.44
  published: '2026-09-15'
  repo: https://github.com/microsoft/mcp
  install: npx -y @azure/mcp@latest server start
  transport: stdio
  probe: >-
    Read the published command surface at
    https://raw.githubusercontent.com/microsoft/mcp/main/servers/Azure.Mcp.Server/docs/azmcp-commands.md
    (318 KB, HTTP 200) and searched it for cost / budget / billing / consumption tool groups.
  result: >-
    No Cost Management tool group exists. The nearest surfaces are `azmcp pricing get` (the
    Azure Retail Prices API — public list prices, not your costs) and Azure Advisor's
    cost-category recommendations. Budgets, Exports, Query, Forecast, Views, Scheduled Actions
    and Alerts are all absent. So even the Azure-wide MCP server cannot answer "what did I
    spend".
  conclusion: adjacent, does not cover this API
