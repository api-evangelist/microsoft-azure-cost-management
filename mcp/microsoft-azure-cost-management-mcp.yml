note: >-
  No Microsoft-published MCP server exposes the Cost Management API. Two adjacent Microsoft MCP
  surfaces were probed and neither covers it, which is the finding worth recording rather than
  a gap worth papering over. The tools below are a DERIVED candidate mapped from real
  operationIds in the 2026-06-01 contract; nobody ships them.
